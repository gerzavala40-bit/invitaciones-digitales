<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muestra - Envía tu Mensaje</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fcfaf8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .invitation-container {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 1px solid #f0e9e1;
        }

        .title {
            font-family: 'Playfair Display', serif;
            color: #c2a990;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 14px;
            color: #777;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0d5c1;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #faf8f5;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #c2a990;
            box-shadow: 0 0 0 3px rgba(194, 169, 144, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: 400;
            color: #333;
            text-transform: none;
            letter-spacing: normal;
            cursor: pointer;
        }

        .radio-label input {
            margin-right: 8px;
            accent-color: #c2a990;
        }

        .btn-submit {
            background-color: #c2a990;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 30px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #a88d72;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Success Message styling */
        .success-message {
            display: none;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 600;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loader */
        .loader {
            display: none;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #c2a990;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-text {
            display: inline-block;
        }

    </style>
</head>
<body>

    <div class="invitation-container">
        <h2 class="title">Confirmar Asistencia</h2>
        <p class="subtitle">Me haría muy feliz compartir este día contigo. Por favor, confirma tu asistencia y déjame un mensaje.</p>

        <!-- Formulario -->
        <!-- En producción, el action será la URL de tu Google Apps Script -->
        <form id="rsvpForm">
            
            <div class="form-group">
                <label for="nombre">Nombre y Apellido</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="form-group">
                <label>¿Asistirás?</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="asistencia" value="Sí, confirmo" required checked> Sí, estaré ahí
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="asistencia" value="No podré asistir"> No podré asistir
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="acompanantes">Cantidad de acompañantes</label>
                <input type="number" id="acompanantes" name="acompanantes" min="0" max="10" placeholder="0" required>
            </div>

            <div class="form-group">
                <label for="mensaje">Déjame un mensaje (Opcional)</label>
                <textarea id="mensaje" name="mensaje" placeholder="Escribe tus buenos deseos aquí..."></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text" id="btnText">Enviar Confirmación</span>
                <div class="loader" id="btnLoader"></div>
            </button>

        </form>

        <div class="success-message" id="successMessage">
            ¡Gracias! Tus datos han sido enviados exitosamente.
        </div>
    </div>

    <script>
        document.getElementById('rsvpForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página se recargue
            
            // Obtener referencias a elementos de UI
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const submitBtn = document.getElementById('submitBtn');
            const form = document.getElementById('rsvpForm');
            const successMessage = document.getElementById('successMessage');

            // Cambiar estado del botón a "Cargando"
            btnText.style.display = 'none';
            btnLoader.style.display = 'block';
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';

            // RECOLECTAR DATOS DEL FORMULARIO
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            console.log("Datos que se enviarían a Google Sheets:", data);

            // SIMULACIÓN DE ENVÍO A GOOGLE SHEETS
            // Aquí es donde en la vida real usarías:
            // fetch('URL_DE_TU_GOOGLE_APP_SCRIPT', { method: 'POST', body: formData })
            
            setTimeout(() => {
                // Simula que la petición tardó 1.5 segundos en llegar a Google Sheets
                
                // Restaurar botón
                btnText.style.display = 'inline-block';
                btnLoader.style.display = 'none';
                
                // Ocultar form y mostrar éxito
                form.style.display = 'none';
                successMessage.style.display = 'block';

            }, 1500);
        });
    </script>
</body>
</html>
