<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Fusión Premium</title>
  
  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600;900&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css" rel="stylesheet">
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* VARIABLES FUSIÓN OSCURA / DORADA */
    :root {
      --bg: #0C0A09;
      --bg-soft: #161210;
      --text: #F5EFE4;
      --text-muted: rgba(245, 239, 228, 0.55);
      --gold: #C9A84C;
      --gold-dim: rgba(201, 168, 76, 0.3);
      --font-body: 'Montserrat', sans-serif;
      --font-script: 'Great Vibes', cursive;
    }

    body {
      font-family: var(--font-body);
      color: var(--text);
      background: var(--bg);
    }

    /* Botón de Audio Flotante */
    .audio-btn {
      position: fixed; top: 20px; right: 20px; z-index: 999;
      background: rgba(12, 10, 9, 0.8); border-radius: 50%;
      border: 1px solid var(--gold);
      width: 50px; height: 50px; display: flex;
      align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      color: var(--gold);
      transition: all 0.3s ease;
      animation: pulse-music 2s infinite;
    }
    .audio-btn:hover { background: var(--gold); color: var(--bg); }
    @keyframes pulse-music {
      0% { box-shadow: 0 0 0 0 rgba(201,168,76, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(201,168,76, 0); }
      100% { box-shadow: 0 0 0 0 rgba(201,168,76, 0); }
    }

    /* Portada Parallax Híbrida */
    .parallax-portada {
      height: 100vh;
      background-image: url('novia (5).webp');
      background-attachment: fixed;
      background-position: center;
      background-size: cover;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    /* Filtro Oscuro sobre la foto */
    .parallax-portada::before {
      content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
      background: rgba(12, 10, 9, 0.65); /* Filtro negro elegante */
      z-index: 0;
    }
    
    .logo-portada {
      position: relative;
      z-index: 1;
      padding: 40px; text-align: center;
    }
    .logo-portada p { 
      letter-spacing: 5px; font-weight: 300; color: var(--gold); 
      margin-bottom: 5px; font-size: 0.9rem; text-transform: uppercase;
    }
    .logo-portada h1 { 
      font-weight: 400; font-size: 4.5rem; line-height: 1; 
      color: var(--text); margin: 0; font-family: var(--font-script);
      text-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .logo-portada h1 span { color: var(--gold); font-size: 0.7em; margin: 0 10px; }

    /* Flecha de Scroll Animada */
    .scroll-down {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 2;
    }
    .scroll-down .mouse {
      width: 24px; height: 38px; border: 2px solid var(--gold); border-radius: 12px; position: relative;
    }
    .scroll-down .mouse::before {
      content: ''; position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px; background: var(--gold); border-radius: 50%;
      animation: scrolldown 1.5s infinite;
    }
    @keyframes scrolldown {
      0% { transform: translate(-50%, 0); opacity: 1; }
      100% { transform: translate(-50%, 15px); opacity: 0; }
    }

    /* Cuenta Regresiva Limpia pero Oscura */
    .cuenta-regresiva { padding: 80px 0; text-align: center; background: var(--bg-soft); }
    .num_cuenta { font-size: 3.5rem; font-weight: 300; margin: 0; line-height: 1; color: var(--gold); }
    .text_cuenta { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-top: 8px; font-weight: 400; }
    
    /* Ceremonia y Fiesta */
    .ceremonia-fiesta { padding: 90px 0; text-align: center; }
    .btn-custom {
      background: transparent; border: 1px solid var(--gold);
      color: var(--gold); padding: 12px 35px; text-transform: uppercase;
      font-size: 0.8rem; font-weight: 400; letter-spacing: 2px;
      margin-top: 30px; transition: all 0.4s;
      border-radius: 50px; /* Botón redondeado elegante */
    }
    .btn-custom:hover { background: var(--gold); color: var(--bg); box-shadow: 0 5px 20px var(--gold-dim); }
    .icono-grande { color: var(--gold); margin-bottom: 25px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); }

    /* Galería */
    .galeria { padding: 80px 0; background: var(--bg-soft); text-align: center; }
    .title-galery { font-weight: 300; letter-spacing: 4px; margin-bottom: 40px; color: var(--gold); text-transform: uppercase; }
    .item-galeria img { width: 100%; height: 250px; object-fit: cover; margin-bottom: 20px; transition: transform 0.4s; border-radius: 5px; }
    .item-galeria img:hover { transform: scale(1.02); }

    /* CBU / Regalos */
    .cbu { padding: 90px 0; text-align: center; }

    /* Confirmar Asistencia Parallax */
    .confirmar {
      padding: 130px 0; text-align: center;
      background-image: url('hero_bg_exact.jpg');
      background-attachment: fixed;
      background-position: center;
      background-size: cover;
      color: var(--text); position: relative;
    }
    .confirmar::before {
      content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
      background: rgba(12, 10, 9, 0.85);
    }
    .confirmar .container { position: relative; z-index: 1; }
    .confirmar h4 { font-weight: 300; letter-spacing: 3px; color: var(--gold); margin-bottom: 15px; }

    /* Modal / Popup */
    .modal-content { border-radius: 10px; padding: 40px; background: var(--bg-soft); border: 1px solid var(--gold-dim); }
    .modal-content h5 { font-weight: 400; letter-spacing: 2px; color: var(--gold); margin-bottom: 25px; }
    
    /* Footer */
    footer { padding: 60px 0; text-align: center; background: #000; color: var(--text-muted); font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; }
    
    @media (max-width: 768px) {
      .num_cuenta { font-size: 2.2rem; }
      .logo-portada h1 { font-size: 3.5rem; }
      .text_cuenta { font-size: 0.7rem; }
    }
  </style>

  

  <!-- SPLASH SCREEN CSS -->
  <style>
    body.locked {
      overflow: hidden;
      height: 100vh;
    }
    .splash-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: #fafafa;
      background-image: url('boda-floral.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 12vh;
      transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.5s ease 0.7s;
    }
    @media (min-width: 768px) {
      .splash-screen {
        background-size: contain;
      }
    }
    .splash-screen.slide-up {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }
    .splash-content {
      text-align: center;
      animation: fadeIn 2s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .btn-abrir {
      background: rgba(255, 255, 255, 0.95);
      color: #333;
      border: 1px solid #555;
      padding: 15px 40px;
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Montserrat', sans-serif;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }
    .btn-abrir:hover {
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    }
    .splash-hint {
      color: #666;
      font-size: 0.85rem;
      letter-spacing: 1px;
      margin: 0;
    }
  </style>
</head>

<body class="locked">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Configuración de Música
    const musicBtn = document.getElementById('btnMusic');
    const musicIcon = document.getElementById('iconMusic');
    const audio = document.getElementById('music');
    let isPlaying = false;

    // Splash Screen Logic
    document.getElementById('btnOpenInvite').addEventListener('click', () => {
      document.getElementById('splashScreen').classList.add('slide-up');
      document.body.classList.remove('locked');
      
      // Auto-play music
      if (!isPlaying) {
        audio.play().then(() => {
          musicIcon.classList.remove('fa-play');
          musicIcon.classList.add('fa-music');
          musicBtn.style.animation = 'pulse-music 2s infinite';
          isPlaying = true;
        }).catch(e => console.log('Autoplay prevent', e));
      }
    });

    musicBtn.addEventListener('click', () => {
      if (isPlaying) {
        audio.pause();
        musicIcon.classList.remove('fa-music');
        musicIcon.classList.add('fa-play');
        musicBtn.style.animation = 'none';
      } else {
        audio.play().catch(e => console.log('Autoplay prevent', e));
        musicIcon.classList.remove('fa-play');
        musicIcon.classList.add('fa-music');
        musicBtn.style.animation = 'pulse-music 2s infinite';
      }
      isPlaying = !isPlaying;
    });

    // Configuración de Cuenta Regresiva (14 Nov 2026 19:00:00)
    const countDate = new Date('Nov 14, 2026 19:00:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const gap = countDate - now;

      if (gap < 0) {
        document.getElementById('cd-d').innerText = "00";
        document.getElementById('cd-h').innerText = "00";
        document.getElementById('cd-m').innerText = "00";
        document.getElementById('cd-s').innerText = "00";
        return;
      }

      const second = 1000;
      const minute = second * 60;
      const hour = minute * 60;
      const day = hour * 24;

      const d = Math.floor(gap / day);
      const h = Math.floor((gap % day) / hour);
      const m = Math.floor((gap % hour) / minute);
      const s = Math.floor((gap % minute) / second);

      document.getElementById('cd-d').innerText = d.toString().padStart(2, '0');
      document.getElementById('cd-h').innerText = h.toString().padStart(2, '0');
      document.getElementById('cd-m').innerText = m.toString().padStart(2, '0');
      document.getElementById('cd-s').innerText = s.toString().padStart(2, '0');
    }
    
    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>

<!-- MUSIC AUTOPLAY FIX -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    var enterButton = document.getElementById('enterBtn') || document.getElementById('btn-open') || document.getElementById('btnOpenInvite') || document.querySelector('#splash button');
    
    if (enterButton) {
      enterButton.addEventListener('click', function() {
        var bgAudio = document.getElementById('bgAudio') || document.getElementById('bgMusic') || document.getElementById('music');
        if (bgAudio) {
          bgAudio.volume = 0.7;
          bgAudio.play().then(function() {
            var musicBtn = document.getElementById('musicBtn') || document.getElementById('btnMusic');
            if (musicBtn) {
              musicBtn.classList.add('playing');
              var icon = document.getElementById('iconMusic') || musicBtn.querySelector('i');
              if (icon && icon.classList.contains('fa-play')) {
                icon.classList.remove('fa-play');
                icon.classList.add('fa-music');
              }
              if (typeof window.musicPlaying !== 'undefined') {
                window.musicPlaying = true;
                musicBtn.style.opacity = '1';
                musicBtn.style.transform = 'scale(1.1)';
              }
              if (typeof window.playing !== 'undefined') {
                window.playing = true;
              }
            }
          }).catch(function(e){ console.log("Autoplay prevent: " + e); });
        }
      });
    }
  });
</script>
