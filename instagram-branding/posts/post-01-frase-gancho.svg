<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1080" fill="#FFF9E0"/>
  
  <!-- Decorative border -->
  <rect x="40" y="40" width="1000" height="1000" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-dasharray="20,10"/>
  
  <!-- Main text block -->
  <rect x="120" y="280" width="840" height="520" fill="#FF6B9D" stroke="#1a1a1a" stroke-width="12"/>
  <!-- Shadow -->
  <rect x="128" y="288" width="840" height="520" fill="none" stroke="none"/>
  
  <!-- Text -->
  <text x="540" y="430" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="72" fill="#1a1a1a">Tu evento</text>
  <text x="540" y="520" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="72" fill="#1a1a1a">merece una</text>
  <text x="540" y="610" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="72" fill="#1a1a1a">invitacion</text>
  
  <!-- Highlight word -->
  <rect x="270" y="640" width="540" height="110" fill="#1a1a1a" stroke="none"/>
  <text x="540" y="730" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="85" fill="#FFF9E0">QUE ROMPA</text>
  
  <!-- Sparkles -->
  <g transform="translate(180, 180)">
    <path d="M0 -25 L7 -7 L25 0 L7 7 L0 25 L-7 7 L-25 0 L-7 -7 Z" fill="#FF8C42" stroke="#1a1a1a" stroke-width="4"/>
  </g>
  <g transform="translate(900, 200)">
    <path d="M0 -20 L5 -5 L20 0 L5 5 L0 20 L-5 5 L-20 0 L-5 -5 Z" fill="#4ECDC4" stroke="#1a1a1a" stroke-width="4"/>
  </g>
  <g transform="translate(150, 880)">
    <path d="M0 -20 L5 -5 L20 0 L5 5 L0 20 L-5 5 L-20 0 L-5 -5 Z" fill="#4ECDC4" stroke="#1a1a1a" stroke-width="4"/>
  </g>
  
  <!-- Logo bottom -->
  <text x="540" y="920" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="36" fill="#1a1a1a">@teinvitoapp</text>
</svg>
