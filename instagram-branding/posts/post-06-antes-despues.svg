  <rect x="540" y="0" width="540" height="1080" fill="#FF6B9D"/>
  
  <!-- ANTES label -->
  <rect x="140" y="80" width="260" height="60" fill="#1a1a1a"/>
  <text x="270" y="122" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="36" fill="white">ANTES</text>
  
  <!-- DESPUES label -->
  <rect x="680" y="80" width="260" height="60" fill="#1a1a1a"/>
  <text x="810" y="122" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="36" fill="white">DESPUES</text>
  
  <!-- WhatsApp message (before) -->
  <rect x="60" y="250" width="420" height="400" rx="20" fill="white" stroke="#ddd" stroke-width="3"/>
  <rect x="80" y="270" width="360" height="50" rx="10" fill="#DCF8C6"/>
  <text x="100" y="305" font-family="Arial, sans-serif" font-size="20" fill="#333">hola el sabado es el</text>
  <rect x="80" y="335" width="380" height="50" rx="10" fill="#DCF8C6"/>
  <text x="100" y="370" font-family="Arial, sans-serif" font-size="20" fill="#333">cumple de emi en casa</text>
  <rect x="80" y="400" width="300" height="50" rx="10" fill="#DCF8C6"/>
  <text x="100" y="435" font-family="Arial, sans-serif" font-size="20" fill="#333">a las 20 traigan algo</text>
  <rect x="80" y="465" width="220" height="50" rx="10" fill="#DCF8C6"/>
  <text x="100" y="500" font-family="Arial, sans-serif" font-size="20" fill="#333">para tomar</text>
  
  <!-- Sad face -->
  <text x="270" y="600" text-anchor="middle" font-size="60">😅</text>
  
  <!-- Phone mockup (after) -->
  <rect x="620" y="220" width="300" height="580" rx="30" fill="#1a1a1a" stroke="none"/>
  <rect x="630" y="240" width="280" height="540" rx="20" fill="white"/>
  <!-- Mini invitation inside -->
  <rect x="630" y="240" width="280" height="100" fill="#FF6B9D"/>
  <text x="770" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="white">Cumple de Emi</text>
  <text x="770" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Te esperamos!</text>
  <text x="770" y="400" text-anchor="middle" font-size="50">🎂</text>
  <text x="770" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#333">Sabado 15</text>
  <text x="770" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">20:00 hs</text>
  <rect x="680" y="520" width="180" height="40" rx="8" fill="#4ECDC4"/>
  <text x="770" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#1a1a1a">Confirmar</text>
  <rect x="680" y="580" width="180" height="40" rx="8" fill="#FF6B9D"/>
  <text x="770" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="white">Ver mapa</text>
  
  <!-- Fire emoji (after) -->
  <text x="810" y="850" text-anchor="middle" font-size="60">😍</text>
  
  <!-- VS divider -->
  <circle cx="540" cy="540" r="40" fill="#1a1a1a" stroke="white" stroke-width="4"/>
  <text x="540" y="552" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="28" fill="white">VS</text>
  
  <!-- Bottom branding -->
  <rect x="340" y="950" width="400" height="70" fill="#1a1a1a"/>
  <text x="540" y="996" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="32" fill="#FFF9E0">@teinvitoapp</text>
