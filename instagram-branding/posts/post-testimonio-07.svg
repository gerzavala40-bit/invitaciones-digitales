<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1080" fill="#4ECDC4"/>
  
  <!-- Quote card -->
  <rect x="108" y="188" width="880" height="580" fill="#1a1a1a" stroke="none"/>
  <rect x="100" y="180" width="880" height="580" fill="#FFF9E0" stroke="#1a1a1a" stroke-width="12"/>
  
  <!-- Big quote marks -->
  <text x="180" y="310" font-family="Georgia, serif" font-size="150" fill="#4ECDC4" opacity="0.5">"</text>
  
  <!-- Testimonial text -->
  <text x="540" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="42" fill="#1a1a1a">Lo mejor fue el Party</text>
  <text x="540" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="42" fill="#1a1a1a">Chat. La gente se</text>
  <text x="540" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="42" fill="#1a1a1a">mataba de risa con los</text>
  <text x="540" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="42" fill="#1a1a1a">zumbidos. Se hicieron</text>
  <text x="540" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="42" fill="#1a1a1a">amigos mesas que no</text>
  <text x="540" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="42" fill="#1a1a1a">se conocian.</text>
  
  <!-- Stars -->
  <text x="540" y="720" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" fill="#FF8C42">★★★★★</text>
  
  <!-- Author -->
  <rect x="290" y="740" width="500" height="70" fill="#4ECDC4" stroke="#1a1a1a" stroke-width="6"/>
  <text x="540" y="788" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="30" fill="#1a1a1a">Pedro y Sol · Boda</text>
  
  <!-- Bottom branding -->
  <text x="540" y="920" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="40" fill="#1a1a1a">@teinvitoapp</text>
  <text x="540" y="980" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#1a1a1a" opacity="0.7">Invitaciones digitales a medida</text>
</svg>
