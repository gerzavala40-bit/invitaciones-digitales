<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1080" fill="#FF8C42"/>
  
  <!-- Quote card -->
  <rect x="108" y="208" width="880" height="580" fill="#1a1a1a" stroke="none"/>
  <rect x="100" y="200" width="880" height="580" fill="#FFF9E0" stroke="#1a1a1a" stroke-width="12"/>
  
  <!-- Big quote marks -->
  <text x="180" y="330" font-family="Georgia, serif" font-size="150" fill="#FF6B9D" opacity="0.5">"</text>
  
  <!-- Testimonial text -->
  <text x="540" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="44" fill="#1a1a1a">Les mandamos la info</text>
  <text x="540" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="44" fill="#1a1a1a">y al otro dia ya</text>
  <text x="540" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="44" fill="#1a1a1a">teniamos todo listo.</text>
  
  <!-- Stars -->
  <text x="540" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="50" fill="#FF8C42">★★★★★</text>
  
  <!-- Author -->
  <rect x="350" y="650" width="380" height="70" fill="#FF6B9D" stroke="#1a1a1a" stroke-width="6"/>
  <text x="540" y="698" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="32" fill="#1a1a1a">Valentina R. · Boda</text>
  
  <!-- Bottom branding -->
  <text x="540" y="920" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="40" fill="#1a1a1a">@teinvitoapp</text>
  <text x="540" y="980" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#1a1a1a" opacity="0.7">Invitaciones digitales a medida</text>
</svg>
