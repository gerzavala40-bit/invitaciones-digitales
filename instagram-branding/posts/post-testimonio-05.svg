<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1080" fill="#FFF9E0"/>
  
  <!-- Border decorative -->
  <rect x="40" y="40" width="1000" height="1000" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-dasharray="20,10"/>
  
  <!-- Quote card -->
  <rect x="108" y="188" width="880" height="580" fill="#1a1a1a" stroke="none"/>
  <rect x="100" y="180" width="880" height="580" fill="white" stroke="#1a1a1a" stroke-width="12"/>
  
  <!-- Big quote marks -->
  <text x="180" y="310" font-family="Georgia, serif" font-size="150" fill="#4ECDC4" opacity="0.5">"</text>
  
  <!-- Testimonial text -->
  <text x="540" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="42" fill="#1a1a1a">En 24 horas ya</text>
  <text x="540" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="42" fill="#1a1a1a">teniamos el link</text>
  <text x="540" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="42" fill="#1a1a1a">listo. Lo mande por</text>
  <text x="540" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="42" fill="#1a1a1a">el grupo y todos</text>
  <text x="540" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="42" fill="#1a1a1a">flashearon. 10/10</text>
  
  <!-- Stars -->
  <text x="540" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="50" fill="#FF8C42">★★★★★</text>
  
  <!-- Author -->
  <rect x="290" y="720" width="500" height="70" fill="#4ECDC4" stroke="#1a1a1a" stroke-width="6"/>
  <text x="540" y="768" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="28" fill="#1a1a1a">Franco D. · Cumple 25</text>
  
  <!-- Bottom branding -->
  <text x="540" y="920" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="40" fill="#1a1a1a">@teinvitoapp</text>
  <text x="540" y="980" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#1a1a1a" opacity="0.7">Invitaciones digitales a medida</text>
</svg>
